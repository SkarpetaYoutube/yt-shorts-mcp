# Konfiguracja Fly.io. Jedyna rzecz do zmiany: nazwa aplikacji poniżej (musi być unikalna globalnie).
# Żadnych sekretów tutaj nie ma — trafiają do `fly secrets set` (patrz README.md).
app = "CHANGE-ME-yt-tools"
primary_region = "waw"   # Warszawa

[build]

[env]
  PORT = "8080"
  FASTMCP_HOME = "/data/fastmcp"   # zaszyfrowane sesje OAuth na trwałym wolumenie
  MCP_CACHE_DIR = "/data/cache"    # cache statystyk i transkrypcji na trwałym wolumenie

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"       # zawsze włączona: bez zimnych startów podczas logowania OAuth
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[mounts]]
  source = "data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
